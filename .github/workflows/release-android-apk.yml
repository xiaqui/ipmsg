name: Release Signed Android APK
# Main-only signed test prerelease; preserve signature, provenance, and re-download verification gates.
# One-time release refresh after repository signing secret rotation; application sources remain unchanged.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: write

jobs:
  build-and-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-test]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare required shared signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Shared signing secrets are missing. Refusing unsigned/debug-key delivery."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android-signing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verify keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Shared signing alias verified."
      - name: Test and build APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Verify signed APK and record provenance
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$APK" > signing.txt
          EXPECTED=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          grep -qi "certificate SHA-256 digest: $EXPECTED" signing.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > badging.txt
          grep -q "package: name='com.xiaqui.ipmsg'" badging.txt
          grep -q "sdkVersion:'23'" badging.txt
          cp "$APK" ipmsg-debug.apk
          sha256sum ipmsg-debug.apk > SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > provenance.txt
          printf 'apk_size=%s\n' "$(stat -c %s ipmsg-debug.apk)" >> provenance.txt
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          results = [ET.parse(p).getroot() for p in pathlib.Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")]
          total = sum(int(r.get("tests", 0)) for r in results)
          failures = sum(int(r.get("failures", 0)) + int(r.get("errors", 0)) for r in results)
          skipped = sum(int(r.get("skipped", 0)) for r in results)
          assert total >= 48 and failures == 0 and skipped == 0, (total, failures, skipped)
          print(f"Unit test results: {total} tests, {failures} failures/errors, {skipped} skipped")
          PY
          cat signing.txt SHA256SUMS provenance.txt
      - name: Publish and verify test prerelease without Actions Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="ipmsg-test-${SHORT_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TITLE="IP Messenger test ${SHORT_SHA} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})"
          printf 'Automated test prerelease. Not delivered to Google Drive.\n\nsource_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > release-notes.txt
          # Keep the assets private as a draft until every downloaded-byte check passes.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.txt \
            --draft \
            --prerelease \
            ipmsg-debug.apk SHA256SUMS provenance.txt signing.txt badging.txt

          # Drafts can be briefly absent from the release listing immediately after creation.
          RELEASE_ID=""
          for attempt in {1..10}; do
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "map(select(.tag_name == \"$TAG\"))[0].id // empty")
            if [ -n "$RELEASE_ID" ]; then
              break
            fi
            sleep 2
          done
          test -n "$RELEASE_ID"
          ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "ipmsg-debug.apk") | .id' | head -1)
          ASSET_SIZE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "ipmsg-debug.apk") | .size' | head -1)
          test -n "$ASSET_ID"

          mkdir release-verify
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > release-verify/ipmsg-debug.apk
          EXPECTED_SHA=$(cut -d' ' -f1 SHA256SUMS)
          DOWNLOADED_SHA=$(sha256sum release-verify/ipmsg-debug.apk | cut -d' ' -f1)
          LOCAL_SIZE=$(stat -c %s ipmsg-debug.apk)
          DOWNLOADED_SIZE=$(stat -c %s release-verify/ipmsg-debug.apk)
          test "$DOWNLOADED_SHA" = "$EXPECTED_SHA"
          test "$DOWNLOADED_SIZE" = "$LOCAL_SIZE"
          test "$ASSET_SIZE" = "$LOCAL_SIZE"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 release-verify/ipmsg-debug.apk > release-signing.txt
          EXPECTED_CERT=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" release-signing.txt

          # Only verified assets become visible as a prerelease.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true > release-published.json
          test "$(jq -r '.draft' release-published.json)" = "false"
          test "$(jq -r '.prerelease' release-published.json)" = "true"
          test "$(jq -r '.tag_name' release-published.json)" = "$TAG"
          RELEASE_URL=$(jq -r '.html_url' release-published.json)
          test -n "$RELEASE_URL"
          {
            echo "### Test prerelease verified"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Release ID: \`$RELEASE_ID\`"
            echo "- APK asset ID: \`$ASSET_ID\`"
            echo "- APK size: \`$LOCAL_SIZE\` bytes"
            echo "- APK SHA-256: \`$EXPECTED_SHA\`"
            echo "- Downloaded APK signature: verified against configured keystore"
            echo "- Release: $RELEASE_URL"
          } | tee -a "$GITHUB_STEP_SUMMARY"
