<section style="display: flex; flex-direction: column; gap: 8px">
<label for="body" style="font-size: 13px; font-weight: 700; color: #5B6B66">本文</label>
<textarea id="body" placeholder="メッセージを入力" style="height: 150px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDE3E0; border-radius: 12px; background: #fff; font: inherit; font-size: 15px; line-height: 1.6; color: #16231F; resize: none; outline: 0"></textarea>

<section style="display: flex; flex-direction: column; background: #fff; border: 1px solid #DDE3E0; border-radius: 12px">

<input type="checkbox" checked style="width: 24px; height: 24px; margin: 0; accent-color: #0F766E">
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; box-sizing: border-box; border-bottom: 1px solid #EAEEEC">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">開封確認を受け取る</span><span style="font-size: 12px; color: #5B6B66">開封されたときに通知します</span></span>
<input type="checkbox" checked style="width: 24px; height: 24px; margin: 0; accent-color: #0F766E">
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; box-sizing: border-box">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">一斉送信（ブロードキャスト）</span><span style="font-size: 12px; color: #5B6B66">同じネットワークの全員に送ります</span></span>
<input type="checkbox" style="width: 24px; height: 24px; margin: 0; accent-color: #0F766E">
</label>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border: 0; border-radius: 14px; background: #0F766E; color: #fff; font: inherit; font-size: 16px; font-weight: 700">
