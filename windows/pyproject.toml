[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaqui-ipmsg-windows"
version = "0.6.0"
description = "LAN-only IP Messenger Windows client compatible with Android protocol v1"
requires-python = ">=3.12"
dependencies = [
  "cryptography==44.0.1",
  "psutil==6.1.1",
  "PySide6==6.8.2.1",
]

[project.scripts]
ipmsg-windows = "ipmsg_windows.app:main"

[tool.setuptools]
packages = ["ipmsg_windows"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]


